<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Darbinieki</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app">

    <div class="topbar">
        <div>
            <h1>Darbinieki</h1>
            <p>Pievieno un koriģē darbiniekus</p>
        </div>

        <div class="top-actions">
            <a class="btn ghost" th:href="@{/}">Dashboard</a>
            <a class="btn ghost" th:href="@{/logout}">Iziet</a>
        </div>
    </div>

    <div class="panel">
        <h2>Pievienot darbinieku</h2>

        <form class="record-form" th:action="@{/employees/add}" method="post">
            <input type="text" name="name" placeholder="Vārds Uzvārds" required>
            <input type="text" name="tabelesNr" placeholder="Tabeles Nr" required>

            <input type="hidden" name="grade" value="-">
            <input type="hidden" name="coefficient" value="1.0">

            <button type="submit">Pievienot</button>
        </form>
    </div>

    <div class="panel">
        <h2>Darbinieku saraksts</h2>

        <div th:each="employee : ${employees}" class="employee-edit-card">

            <form th:action="@{/employees/edit/{id}(id=${employee.id})}"
                  method="post"
                  class="employee-edit-form">

                <input type="text"
                       name="name"
                       th:value="${employee.name}"
                       placeholder="Vārds Uzvārds">

                <input type="text"
                       name="tabelesNr"
                       th:value="${employee.tabelesNr}"
                       placeholder="Tabeles Nr">

                <input type="hidden" name="grade" value="-">
                <input type="hidden" name="coefficient" value="1.0">

                <button class="small-btn" type="submit">Saglabāt</button>

                <a class="small-btn danger"
                   th:href="@{/employees/delete/{id}(id=${employee.id})}">
                    Dzēst
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
