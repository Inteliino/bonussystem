<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lietotāji</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div class="users-hero">
        <div>
            <div class="users-icon">🛡️</div>
            <h1>Lietotāji</h1>
            <p>Admin pārvalda sistēmas piekļuves un lomas</p>
        </div>

        <div class="users-hero-actions">
            <a href="/" class="btn ghost">Dashboard</a>
            <a href="/employees" class="btn ghost">Darbinieki</a>
            <a href="/logout" class="btn ghost danger">Iziet</a>
        </div>
    </div>

    <div class="user-wow-add">
        <div>
            <h2>➕ Pievienot lietotāju</h2>
            <p>Izveido jaunu piekļuvi sistēmai</p>
        </div>

        <form method="post" action="/users/add" class="user-wow-form">
            <input type="text" name="username" placeholder="Lietotājvārds" required>
            <input type="text" name="password" placeholder="Parole" required>

            <select name="role" required>
                <option value="USER">USER - parasts lietotājs</option>
                <option value="ADMIN">ADMIN - pilna piekļuve</option>
            </select>

            <button type="submit" class="btn primary">Pievienot</button>
        </form>
    </div>

    <div class="user-wow-list">

        <div class="user-list-top">
            <div>
                <h2>Esošie lietotāji</h2>
                <p>Šeit vari mainīt lietotājvārdu, paroli un lomu</p>
            </div>

            <div class="user-count-card">
                <span>Kopā</span>
                <strong th:text="${#lists.size(users)}">0</strong>
                <p>lietotāji</p>
            </div>
        </div>

        <div class="user-cards">

            <div class="user-row-card" th:each="user : ${users}">

                <form th:action="@{/users/edit/{id}(id=${user.id})}"
                      method="post"
                      th:id="'userForm' + ${user.id}">
                </form>

                <div class="user-id-badge">
                    <span>ID</span>
                    <strong th:text="${user.id}">1</strong>
                </div>

                <div class="user-person">
                    <div class="user-avatar">👤</div>
                    <div>
                        <label>Lietotājvārds</label>
                        <input type="text"
                               name="username"
                               th:value="${user.username}"
                               th:form="'userForm' + ${user.id}"
                               required>
                    </div>
                </div>

                <div class="user-password">
                    <label>Parole</label>
                    <input type="text"
                           name="password"
                           th:value="${user.password}"
                           th:form="'userForm' + ${user.id}"
                           required>
                </div>

                <div class="user-role">
                    <label>Loma</label>
                    <select name="role" th:form="'userForm' + ${user.id}">
                        <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                    </select>
                </div>

                <div class="user-wow-actions">
                    <button type="submit"
                            class="small-btn blue"
                            th:form="'userForm' + ${user.id}">
                        Saglabāt
                    </button>

                    <a th:href="@{/users/delete/{id}(id=${user.id})}"
                       class="small-btn red"
                       onclick="return confirm('Tiešām dzēst šo lietotāju?')">
                        Dzēst
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
