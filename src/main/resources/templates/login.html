<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Maiņu attinēju prēmijas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>

<body class="new-login-body">

<div class="new-login-page">

<div class="login-logo-box">
    <img class="login-logo-img"
         src="https://www.valmiera-glass.com/img/logo-valmiera-glass-2018.svg"
         alt="Valmiera Glass logo">
    <span>Valmiera Glass</span>
</div>

    <h1>Maiņu attinēju prēmijas</h1>
    <p>Maiņu prēmiju uzskaites sistēma</p>

    <div class="new-login-features">
        <div>👥 Darbinieku pārvaldība</div>
        <div>📊 Prēmiju statistika</div>
    </div>

    <div class="new-login-card">

        <h2>Ielogoties</h2>

        <form method="post" action="/login">

            <div class="login-input-wrap">
                <span>👤</span>
                <input type="text" name="username" placeholder="Lietotājvārds" required>
            </div>

            <div class="login-input-wrap">
                <span>🔒</span>
                <input type="password" name="password" placeholder="Parole" required>
            </div>

            <button type="submit" class="login-submit">
                Ieiet sistēmā <span>→</span>
            </button>

        </form>

        <div th:if="${param.error}" class="login-error">
            Nepareizs lietotājvārds vai parole!
        </div>

    </div>

</div>

</body>
</html>
